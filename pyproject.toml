[project]
name = "livraria"
version = "0.1.0"
description = "API REST Django para uma livraria, com painel administrativo."
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.17",
    "django-filter>=24.3",
    "django-cors-headers>=4.6",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "pillow>=11.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python manage.py runserver 0.0.0.0:8000"
migrate = { composite = ["python manage.py makemigrations core", "python manage.py migrate"] }
shellp = "python manage.py shell"
createsuperuser = "python manage.py createsuperuser"
